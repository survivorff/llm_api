# 生产参考编排：app + postgres + redis。
# 快速体验（仅 SQLite）可只跑 app 服务，注释掉 db/redis 与相关环境变量。
services:
  app:
    build: .
    container_name: llm-api
    ports:
      - "8080:8080"
    environment:
      ADMIN_KEY: ${ADMIN_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      CRYPTO_SECRET: ${CRYPTO_SECRET}
      # 生产用 Postgres；如需 SQLite 单机，改为 sqlite+aiosqlite:////app/data/llm_api.db
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://llmapi:llmapi@db:5432/llmapi}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OAUTH_PROVIDERS: ${OAUTH_PROVIDERS:-{}}
      PAYMENT_PROVIDERS: ${PAYMENT_PROVIDERS:-{}}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-zh}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      LEGACY_CONFIG_PATH: ""
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: llm-api-db
    environment:
      POSTGRES_USER: llmapi
      POSTGRES_PASSWORD: llmapi
      POSTGRES_DB: llmapi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmapi"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: llm-api-redis
    restart: unless-stopped

volumes:
  pgdata:
